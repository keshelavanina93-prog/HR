name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      APP_ENV: development
      COOKIE_SECURE: '0'
      SEED_DEMO: '1'
      GOOGLE_CLIENT_ID: ''
      ADMIN_EMAIL: ''
      ADMIN_PASSWORD: ''
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q server.py features mail_worker.py tests migrations
      - name: Check JavaScript syntax
        run: for file in static/*.js; do node --check "$file"; done
      - name: Run integration tests
        run: python -m pytest tests -q
  postgres:
    name: PostgreSQL integration and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sivrce_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: sivrce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sivrce_test -d sivrce_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://sivrce_test:local-test-only@127.0.0.1:5432/sivrce_test
      TEST_DATABASE_URL: postgresql+psycopg://sivrce_test:local-test-only@127.0.0.1:5432/sivrce_test
      APP_ENV: development
      SEED_DEMO: '1'
      COOKIE_SECURE: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply migrations to a fresh database
        run: python -m alembic upgrade head
      - name: Verify schema matches application models
        run: python -m alembic check
      - name: Run real PostgreSQL integration tests
        run: python -m pytest tests -q
